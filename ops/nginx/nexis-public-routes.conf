# Nexis public SEO routes.
# Include inside the canonical HTTPS server block after the root declaration
# and before the generic `location /` SPA fallback.

location = /news {
    add_header Cache-Control "no-cache" always;
    try_files /news.html =404;
}

location = /rules {
    add_header Cache-Control "no-cache" always;
    try_files /rules.html =404;
}

location = /staff {
    add_header Cache-Control "no-cache" always;
    try_files /staff.html =404;
}

location = /contact {
    add_header Cache-Control "no-cache" always;
    try_files /contact.html =404;
}

location = /credits {
    add_header Cache-Control "no-cache" always;
    try_files /credits.html =404;
}

# Keep the clean public URLs canonical if someone requests a build artifact.
location = /news.html { return 301 /news; }
location = /rules.html { return 301 /rules; }
location = /staff.html { return 301 /staff; }
location = /contact.html { return 301 /contact; }
location = /credits.html { return 301 /credits; }


# Serve only known client-side application routes through the private app shell.
# The parent site config must use:
#   location / { try_files $uri $uri/ @nexis_app; }
# Unknown extensionless paths therefore return a real HTTP 404 instead of
# falling through to app.html with a misleading 200 response.
location @nexis_app {
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    if ($uri !~ ^/(?:register|login|forgot-password|reset-password|confirm-email-change|home|records|settings|ciel-intro|inventory|crafting|profile|profiles|achievements|titles|housing|guild|guilds|consortiums|admin|hospital|jail|salvage-yard|city-board|skills|tavern|icon-gallery|education|adventure|jobs|civic-jobs|arena|travel|one-shots|world-map|codex|wiki|city|market|black-market|bank|academies|life-paths|search/advanced|city/property-office|city/academy|(?:profile|profiles|guild|guilds|consortiums|maps)/[^/]+)/?$) {
        return 404;
    }

    try_files /app.html =404;
}
