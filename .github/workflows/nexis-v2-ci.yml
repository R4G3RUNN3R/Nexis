name: Nexis V2 CI

on:
  push:
    branches:
      - feature/nexis-v2-foundation-skeleton
    paths:
      - 'v2/**'
      - '.github/workflows/nexis-v2-ci.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/nexis-v2-ci.yml'

permissions:
  contents: read

concurrency:
  group: nexis-v2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-v2:
    name: Restore, build and test Nexis V2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v2
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure .NET 10 SDK baseline
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'

      - name: Show resolved .NET environment
        run: |
          dotnet --version
          dotnet --info

      - name: Restore
        run: dotnet restore Nexis.slnx

      - name: Build with warnings as errors
        run: dotnet build Nexis.slnx --configuration Release --no-restore

      - name: Run architecture and Core conformance tests
        run: >-
          dotnet test
          --project tests/Nexis.Architecture.Tests/Nexis.Architecture.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --minimum-expected-tests 1
          --output Detailed
